<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&amp;display=swap">
  <style>
    body { margin: 0; font-family: Roboto, Arial, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
    a { color: oklch(0.76 0.15 320); }
    a:hover { color: oklch(0.85 0.12 320); }
  </style>
</helmet>

<div style="width: 400px; height: 720px; background: #0f0f0f; color: #f1f1f1; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: center; gap: 6px; height: 48px; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,.12); flex-shrink: 0;">
    <div style="font-size: 14px; font-weight: 500;">上位チャット</div>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"></path></svg>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px; overflow: hidden; justify-content: flex-end;">
    <div style="display: flex; gap: 8px; align-items: flex-start;">
      <div style="width: 24px; height: 24px; border-radius: 50%; background: oklch(0.55 0.11 30); flex-shrink: 0;"></div>
      <div style="font-size: 13px; line-height: 1.45;"><span style="color: #aaa; font-weight: 500;">たぬきち</span> <span>88888888</span></div>
    </div>
    <div style="display: flex; gap: 8px; align-items: flex-start;">
      <div style="width: 24px; height: 24px; border-radius: 50%; background: oklch(0.55 0.11 150); flex-shrink: 0;"></div>
      <div style="font-size: 13px; line-height: 1.45;"><span style="color: #2ba640; font-weight: 500;">ゆうき</span> <span>歌うますぎる…</span></div>
    </div>
    <div style="display: flex; gap: 8px; align-items: flex-start;">
      <div style="width: 24px; height: 24px; border-radius: 50%; background: oklch(0.55 0.11 260); flex-shrink: 0;"></div>
      <div style="font-size: 13px; line-height: 1.45;"><span style="color: #aaa; font-weight: 500;">ぽんず</span> <span>わこつ〜</span></div>
    </div>
    <div style="display: flex; gap: 8px; align-items: flex-start;">
      <div style="width: 24px; height: 24px; border-radius: 50%; background: oklch(0.55 0.11 330); flex-shrink: 0;"></div>
      <div style="font-size: 13px; line-height: 1.45;"><span style="color: #2ba640; font-weight: 500;">みかん</span> <span>かわいい</span></div>
    </div>
    <div style="display: flex; gap: 8px; align-items: flex-start;">
      <div style="width: 24px; height: 24px; border-radius: 50%; background: oklch(0.55 0.11 15); flex-shrink: 0;"></div>
      <div style="font-size: 13px; line-height: 1.45;"><span style="color: #aaa; font-weight: 500;">さくら</span> <span>今日も最高だった</span></div>
    </div>
  </div>

  <div style="flex-shrink: 0; border-top: 1px solid rgba(255,255,255,.12); background: #121212; padding: 10px 10px 8px;">

    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px; padding: 0 2px;">
      <div style="display: flex; align-items: center; gap: 6px; background: oklch(0.72 0.19 320 / .14); border: 1px solid oklch(0.72 0.19 320 / .35); border-radius: 999px; padding: 4px 10px;">
        <span style="width: 7px; height: 7px; border-radius: 50%; background: oklch(0.76 0.19 320);"></span>
        <span style="font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif; font-size: 12px; font-weight: 700;">歌枠デッキ</span>
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="oklch(0.76 0.19 320)" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"></path></svg>
      </div>
      <span style="font-size: 11px; color: #777;">12枚</span>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 4px; background: rgba(255,255,255,.09); border-radius: 999px; padding: 5px 10px;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#f1f1f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="7" height="16" rx="1.5"></rect><rect x="14" y="4" width="7" height="16" rx="1.5"></rect></svg>
        <span style="font-size: 11px;">編成</span>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">

      <div style="height: 100px; box-sizing: border-box; border-radius: 14px; background: oklch(0.72 0.19 320 / .10); border: 1px solid oklch(0.72 0.19 320 / .28); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 8px; position: relative;">
        <div style="position: absolute; top: 7px; right: 9px; font-size: 9px; color: oklch(0.76 0.14 320 / .8);">284</div>
        <div style="font-size: 26px; line-height: 1;">🎶</div>
        <div style="font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif; font-size: 11px; font-weight: 700; color: #f1f1f1; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">歌スタート</div>
      </div>

      <div style="height: 100px; box-sizing: border-box; border-radius: 14px; background: oklch(0.72 0.19 320 / .10); border: 1px solid oklch(0.72 0.19 320 / .28); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 8px; position: relative;">
        <div style="position: absolute; top: 7px; right: 9px; font-size: 9px; color: oklch(0.76 0.14 320 / .8);">196</div>
        <div style="font-size: 19px; line-height: 1; letter-spacing: -1px; color: #e9e9e9;">888</div>
        <div style="font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif; font-size: 11px; font-weight: 700; color: #f1f1f1; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">拍手</div>
      </div>

      <div style="height: 100px; box-sizing: border-box; border-radius: 14px; background: oklch(0.72 0.19 320 / .18); border: 2px solid oklch(0.76 0.19 320 / .85); box-shadow: 0 0 16px oklch(0.72 0.19 320 / .30); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 8px; position: relative;">
        <div style="position: absolute; top: 6px; right: 8px; font-size: 9px; color: oklch(0.86 0.14 320);">153</div>
        <div style="display: flex; gap: 2px;">
          <span style="width: 22px; height: 22px; border-radius: 6px; background: oklch(0.62 0.15 320); display: flex; align-items: center; justify-content: center;"><svg width="13" height="13" viewBox="0 0 24 24" fill="#fff"><path d="M12 21s-7.5-4.7-9.3-9A5.2 5.2 0 0 1 12 6.6 5.2 5.2 0 0 1 21.3 12C19.5 16.3 12 21 12 21z"></path></svg></span>
          <span style="width: 22px; height: 22px; border-radius: 6px; background: oklch(0.62 0.15 320); display: flex; align-items: center; justify-content: center;"><svg width="13" height="13" viewBox="0 0 24 24" fill="#fff"><path d="M12 21s-7.5-4.7-9.3-9A5.2 5.2 0 0 1 12 6.6 5.2 5.2 0 0 1 21.3 12C19.5 16.3 12 21 12 21z"></path></svg></span>
        </div>
        <div style="font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif; font-size: 11px; font-weight: 700; color: #fff; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">メン限 ×4</div>
      </div>

      <div style="height: 100px; box-sizing: border-box; border-radius: 14px; background: oklch(0.72 0.19 320 / .10); border: 1px solid oklch(0.72 0.19 320 / .28); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 8px; position: relative;">
        <div style="position: absolute; top: 7px; right: 9px; font-size: 9px; color: oklch(0.76 0.14 320 / .8);">98</div>
        <div style="font-size: 12px; line-height: 1.25; text-align: center; color: #e9e9e9;">はい！はい！<br>はい！はい！</div>
        <div style="font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif; font-size: 11px; font-weight: 700; color: #f1f1f1; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">コール</div>
      </div>

      <div style="height: 100px; box-sizing: border-box; border-radius: 14px; background: oklch(0.72 0.19 320 / .10); border: 1px solid oklch(0.72 0.19 320 / .28); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 8px; position: relative;">
        <div style="position: absolute; top: 7px; right: 9px; font-size: 9px; color: oklch(0.76 0.14 320 / .8);">61</div>
        <div style="font-size: 26px; line-height: 1;">🎉</div>
        <div style="font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif; font-size: 11px; font-weight: 700; color: #f1f1f1; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">おめでとう</div>
      </div>

      <div style="height: 100px; box-sizing: border-box; border-radius: 14px; background: rgba(255,255,255,.03); border: 1px dashed rgba(255,255,255,.18); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 8px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6f6f6f" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        <div style="font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif; font-size: 10px; color: #6f6f6f;">今の入力を保存</div>
      </div>

    </div>

    <div style="display: flex; align-items: center; justify-content: center; gap: 5px; padding-top: 7px;">
      <span style="width: 14px; height: 3px; border-radius: 2px; background: oklch(0.76 0.19 320);"></span>
      <span style="width: 4px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.22);"></span>
      <span style="width: 4px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.22);"></span>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-top: 1px solid rgba(255,255,255,.12); flex-shrink: 0;">
    <div style="width: 24px; height: 24px; border-radius: 50%; background: oklch(0.58 0.12 210); flex-shrink: 0;"></div>
    <div style="flex: 1; font-size: 13px; color: #717171;">チャットでメッセージを送信…</div>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="1.8"><circle cx="12" cy="12" r="9"></circle><path d="M9 10h.01M15 10h.01M8.5 14.5a4.5 4.5 0 0 0 7 0" stroke-linecap="round"></path></svg>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="1.8" stroke-linejoin="round"><path d="M3.5 11.5 20.5 4l-7.5 17-2-7-7-2.5z"></path></svg>
  </div>

</div>
</x-dc>
</body>
</html>
