<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OshiDeck 設定</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1>OshiDeck</h1>

    <section class="card">
      <h2>送信設定</h2>
      <label class="switch-row">
        <input id="autoSend" type="checkbox">
        <span>
          <strong>プリセットをクリックしたら自動送信する</strong>
          <small>オフの場合はチャット入力欄に挿入するだけです。</small>
        </span>
      </label>
    </section>

    <p id="saved" aria-live="polite"></p>
  </main>

  <script src="options.js"></script>
</body>
</html>
