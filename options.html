<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="ui.title">OshiDeck 設定</title>
  <link rel="stylesheet" href="src/channel-marks.css">
  <link rel="stylesheet" href="content.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main id="privacySetup" hidden>
    <header><h1>OshiDeck</h1></header>
    <section class="card privacy-copy" aria-labelledby="privacyTitle">
      <h2 id="privacyTitle" data-i18n="opt.privacyTitle"></h2>
      <p data-i18n="opt.privacyChat"></p>
      <p data-i18n="opt.privacyLocal"></p>
      <p data-i18n="opt.privacyExternal"></p>
      <p><a href="https://oshideck.setori.app/ja/privacy/" id="privacyPolicy" target="_blank"
          rel="noreferrer" data-i18n="opt.privacyPolicy"></a></p>
      <button type="button" id="privacyEnable" class="action" data-i18n="opt.privacyEnable"></button>
      <p id="privacyStatus" role="status"></p>
    </section>
  </main>
  <main id="appSettings">
    <header>
      <h1>OshiDeck</h1>
      <p class="lede" data-i18n="ui.lede"></p>
    </header>

    <section class="card decks">
      <div class="deck-heading">
        <h2 data-i18n="ui.decks"></h2>
        <div id="deckCardPreview" class="deck-card-preview" role="status"></div>
      </div>

      <div class="browser">
        <nav id="deckList" class="deck-list" data-i18n-aria-label="aria.deckList"></nav>

        <div class="deck-main">
          <div id="deckHeader" class="deck-header"></div>
          <div id="deckCards" class="deck-cards"></div>
          <p id="deckHint" class="muted deck-hint"></p>
        </div>

        <aside id="pool" class="pool" data-i18n-aria-label="ui.pool">
          <div class="pool-head">
            <strong data-i18n="ui.pool"></strong>
            <span id="poolCount" class="muted"></span>
          </div>
          <label class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path>
            </svg>
            <input id="deckSearch" type="search" data-i18n-placeholder="ui.searchPlaceholder" autocomplete="off">
          </label>
          <div id="poolCards" class="pool-cards"></div>
        </aside>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="ui.displayMode"></h2>

      <div class="modes">
        <label class="mode">
          <input type="radio" name="mode" value="hand" checked>
          <span class="mode-body">
            <span class="thumb thumb-hand" aria-hidden="true">
              <span class="thumb-row"><i></i><i></i><i></i><i class="on"></i><i></i><i></i><i></i></span>
              <span class="thumb-row"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
            </span>
            <strong data-i18n="ui.modeHand"></strong>
            <small data-i18n="ui.modeHandNote"></small>
          </span>
        </label>

        <label class="mode">
          <input type="radio" name="mode" value="list">
          <span class="mode-body">
            <span class="thumb thumb-list" aria-hidden="true">
              <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
            </span>
            <strong data-i18n="ui.modeList"></strong>
            <small data-i18n="ui.modeListNote"></small>
          </span>
        </label>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="ui.handLayout"></h2>

      <div class="row">
        <div class="row-label">
          <strong data-i18n="ui.cardSize"></strong>
          <small data-i18n="ui.cardSizeNote"></small>
        </div>
        <div class="segmented" data-setting="cardSize">
          <button type="button" value="large" data-i18n="size.large"></button>
          <button type="button" value="medium" data-i18n="size.medium"></button>
          <button type="button" value="small" data-i18n="size.small"></button>
        </div>
      </div>

      <div class="row">
        <div class="row-label">
          <strong data-i18n="ui.rows"></strong>
          <small><span id="capacity"></span><span data-i18n="ui.rowsNote"></span></small>
        </div>
        <div class="segmented" data-setting="rows">
          <button type="button" value="1" data-i18n="ui.row1"></button>
          <button type="button" value="2" data-i18n="ui.row2"></button>
        </div>
      </div>

      <div class="row">
        <div class="row-label">
          <strong data-i18n="ui.sortBy"></strong>
          <small id="sortNote" data-i18n="ui.sortNoteDefault"></small>
        </div>
        <div class="segmented segmented-wide" data-setting="sortBy">
          <button type="button" value="trend" data-i18n="sort.trend"></button>
          <button type="button" value="heat" data-i18n="sort.heat"></button>
          <button type="button" value="uses" data-i18n="sort.uses"></button>
          <button type="button" value="manual" data-i18n="sort.manual"></button>
        </div>
      </div>

      <div class="row">
        <div class="row-label">
          <strong data-i18n="ui.pace"></strong>
          <small id="paceNote"></small>
        </div>
        <div class="choice">
          <div class="segmented" data-setting="pace">
            <button type="button" value="slow" data-i18n="ui.slow"></button>
            <button type="button" value="normal" data-i18n="ui.normal"></button>
            <button type="button" value="quick" data-i18n="ui.quick"></button>
          </div>
          <input class="seconds" type="number" min="1" max="600" step="1" inputmode="numeric"
                 data-seconds="pace" data-i18n-placeholder="ui.secondsShort"
                 data-i18n-aria-label="ui.customSeconds">
        </div>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="ui.drawFromChat"></h2>
      <label class="switch-row">
        <input id="suggest" type="checkbox">
        <span>
          <strong data-i18n="ui.suggest"></strong>
          <small data-i18n="ui.suggestNote"></small>
        </span>
      </label>

      <div class="row">
        <div class="row-label">
          <strong data-i18n="ui.drawEase"></strong>
          <small id="drawNote"></small>
        </div>
        <div class="segmented" data-setting="draw">
          <button type="button" value="shy" data-i18n="ui.shy"></button>
          <button type="button" value="normal" data-i18n="ui.normal"></button>
          <button type="button" value="eager" data-i18n="ui.eager"></button>
        </div>
      </div>

      <div class="row">
        <div class="row-label">
          <strong data-i18n="ui.holdTime"></strong>
          <small id="holdNote"></small>
        </div>
        <div class="choice">
          <div class="segmented" data-setting="hold">
            <button type="button" value="long" data-i18n="ui.long"></button>
            <button type="button" value="normal" data-i18n="ui.normal"></button>
            <button type="button" value="short" data-i18n="ui.short"></button>
          </div>
          <input class="seconds" type="number" min="1" max="600" step="1" inputmode="numeric"
                 data-seconds="hold" data-i18n-placeholder="ui.secondsShort"
                 data-i18n-aria-label="ui.customSeconds">
        </div>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="ui.send"></h2>
      <label class="switch-row">
        <input id="autoSend" type="checkbox">
        <span>
          <strong data-i18n="ui.autoSend"></strong>
          <small><span data-i18n="ui.autoSendNote1"></span> <span class="keys"><kbd>⇧</kbd><span data-i18n="ui.autoSendNote2"></span></span></small>
        </span>
      </label>
    </section>

    <section class="card">
      <h2 data-i18n="ui.language"></h2>

      <div class="row">
        <div class="row-label">
          <strong data-i18n="ui.language"></strong>
          <small data-i18n="ui.languageNote"></small>
        </div>
        <div class="segmented" data-choice="language">
          <button type="button" value="" data-i18n="ui.languageAuto"></button>
        </div>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="ui.backup"></h2>

      <div class="row">
        <div class="row-label">
          <strong data-i18n="ui.export"></strong>
          <small data-i18n="ui.exportNote"></small>
        </div>
        <button id="exportBtn" type="button" class="action" data-i18n="ui.saveToFile"></button>
      </div>

      <div class="row">
        <div class="row-label">
          <strong data-i18n="ui.import"></strong>
          <small id="importNote" data-i18n="opt.mergeNote"></small>
        </div>
        <div class="segmented" data-choice="importMode">
          <button type="button" value="merge" data-i18n="ui.merge"></button>
          <button type="button" value="replace" data-i18n="ui.replaceAll"></button>
        </div>
        <button id="importBtn" type="button" class="action" data-i18n="ui.pickFile"></button>
        <input id="importFile" type="file" accept="application/json,.json" hidden>
        <input id="deckFile" type="file" accept="application/json,.json" hidden>
      </div>

      <p id="importStatus" class="import-status" aria-live="polite"></p>
    </section>

    <section class="card">
      <h2 data-i18n="ui.journal"></h2>

      <div class="row">
        <div class="row-label">
          <strong data-i18n="ui.export"></strong>
          <small data-i18n="ui.journalNote"></small>
          <small data-i18n="ui.journalPrivacy"></small>
        </div>
        <button id="journalBtn" type="button" class="action" data-i18n="ui.saveToFile"></button>
      </div>

      <div class="row">
        <div class="row-label">
          <strong data-i18n="ui.clear"></strong>
          <small data-i18n="ui.clearNote"></small>
        </div>
        <button id="journalClear" type="button" class="action" data-i18n="ui.clearButton"></button>
      </div>

      <p id="journalStatus" class="import-status" aria-live="polite"></p>
    </section>

  </main>

  <div id="saved" role="status" aria-live="polite" aria-atomic="true"></div>

  <script src="src/i18n.js"></script>
  <script src="src/privacy.js"></script>
  <script src="src/layout.js"></script>
  <script src="src/store.js"></script>
  <script src="src/tokens.js"></script>
  <script src="src/backup.js"></script>
  <script src="src/journal.js"></script>
  <script src="src/presets.js"></script>
  <script src="src/channel-marks.js"></script>
  <script src="options.js"></script>
</body>
</html>
